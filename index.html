<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vocabulário completo — 한국어 2-2 (Unidades 1–16)</title>
<style>
:root{--bg:#0f1117;--s1:#171a23;--s2:#1e2230;--bd:#2b3042;--tx:#e8eaf0;--tx2:#a9b0c4;--ac:#6aa8ff;--ac2:#3d7be0;--ok:#5fd39a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans KR","Malgun Gothic",sans-serif}
header{padding:20px 16px 8px;max-width:1100px;margin:0 auto}
h1{font-size:20px;margin:0 0 4px}
.sub{color:var(--tx2);font-size:13px}
.bar{position:sticky;top:0;z-index:5;background:rgba(15,17,23,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--bd);padding:10px 16px}
.bar-in{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
input[type=search]{flex:1;min-width:160px;background:var(--s1);border:1px solid var(--bd);color:var(--tx);border-radius:10px;padding:9px 12px;font-size:14px}
button{background:var(--s1);color:var(--tx);border:1px solid var(--bd);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer}
button.on{background:var(--ac2);border-color:var(--ac2);color:#fff}
button:focus-visible,input:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
main{max-width:1100px;margin:0 auto;padding:8px 16px 60px}
section.unit{margin-top:22px}
section.unit h2{font-size:17px;margin:0 0 2px;color:var(--ac)}
.theme{color:var(--tx2);font-size:12.5px;margin:0 0 10px}
.grp{background:var(--s2);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.grp h3{font-size:13px;margin:0 0 8px;color:var(--tx2);font-weight:600;letter-spacing:.2px}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:6px}
.it{background:var(--s1);border-radius:9px;padding:7px 10px;display:flex;justify-content:space-between;gap:10px;align-items:baseline;cursor:pointer;border:1px solid transparent}
.it:hover{border-color:var(--bd)}
.ko{font-size:15px;font-weight:600;color:var(--tx)}
.pt{font-size:12.5px;color:var(--tx2);text-align:right}
.hide-pt .it:not(.rev) .pt{filter:blur(6px);user-select:none}
.hide-ko .it:not(.rev) .ko{filter:blur(7px);user-select:none}
.it.known{opacity:.7}
.it.known .ko{color:var(--ok)}
.hidden{display:none!important}
.cnt{font-size:12px;color:var(--tx2)}
.note{font-size:12px;color:var(--tx2);margin-top:6px}
.empty{color:var(--tx2);padding:30px 0;text-align:center}
</style>
</head>

<header>
  <h1>Vocabulário completo · 재외동포를 위한 한국어 2-2</h1>
  <div class="sub" id="total"></div>
</header>
<div class="bar"><div class="bar-in">
  <div class="row">
    <input type="search" id="q" placeholder="Buscar palavra ou tópico (ex.: transporte, saúde)…" aria-label="Buscar">
  </div>
  <div class="row" id="modes">
    <button data-m="all" class="on">Ver tudo</button>
    <button data-m="hide-pt">Esconder português</button>
    <button data-m="hide-ko">Esconder coreano</button>
    <button id="shuf">Embaralhar</button>
    <button id="unk">Só os que não sei</button>
    <button id="clr">Limpar “já sei”</button>
    <button id="exp">Exportar “já sei”</button>
    <button id="imp">Importar</button>
    <input type="file" id="impf" accept=".json,application/json" class="hidden">
    <span class="cnt" id="cnt"></span>
  </div>
  <div class="cnt" id="sync" aria-live="polite"></div>
  <div class="row" id="units"></div>
</div></div>
<main id="main"></main>

      if(it)gh+='<div class="grp"><h3>'+esc(g[0])+'</h3><div class="items">'+it+'</div></div>';
    });
    if(gh)html+='<section class="unit"><h2>'+u.n+'과 · '+esc(u.t)+'</h2><p class="theme">'+esc(u.th)+'</p>'+gh+'</section>';
  });
  main.innerHTML=html||'<div class="empty">Nada encontrado.</div>';
  document.getElementById('cnt').textContent=shown+' itens';
}
function bu(){
  var h='<button data-u="0" class="on">Todas</button>';
  U.forEach(function(u){h+='<button data-u="'+u.n+'">'+u.n+'과</button>'});
  unitsEl.innerHTML=h;
}
unitsEl.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;activeUnit=+b.dataset.u;[].forEach.call(unitsEl.children,function(x){x.classList.toggle('on',x===b)});render();});
document.getElementById('modes').addEventListener('click',function(e){
  var b=e.target.closest('button[data-m]');if(!b)return;mode=b.dataset.m;
  [].forEach.call(document.querySelectorAll('#modes button[data-m]'),function(x){x.classList.toggle('on',x===b)});
  main.className=mode==='all'?'':mode;
});
document.getElementById('q').addEventListener('input',render);
document.getElementById('shuf').addEventListener('click',function(){
  [].forEach.call(document.querySelectorAll('.items'),function(box){
    var a=[].slice.call(box.children);for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}
    a.forEach(function(x){box.appendChild(x)});
  });
});
document.getElementById('unk').addEventListener('click',function(){onlyUnk=!onlyUnk;this.classList.toggle('on',onlyUnk);render()});
document.getElementById('clr').addEventListener('click',function(){known={};save();mark();render()});
var lastTap=0,lastEl=null;
main.addEventListener('click',function(e){
  var it=e.target.closest('.it');if(!it)return;var now=Date.now();
  if(lastEl===it&&now-lastTap<350){var k=it.dataset.k;if(known[k])delete known[k];else known[k]=1;save();mark();if(onlyUnk){lastEl=null;render();return}it.classList.toggle('known');it.classList.remove('rev');lastEl=null;return}
  lastEl=it;lastTap=now;it.classList.toggle('rev');
});
bu();render();
var st=document.getElementById('sync'),hadLocal=false;
try{hadLocal=localStorage.getItem('kn22')!==null}catch(e){}
function setSt(t){st.textContent=t}
function mark(){}
function fromList(a){var o={};a.forEach(function(k){o[k]=1});return o}
document.getElementById('exp').addEventListener('click',function(){
  var a=Object.keys(known).sort(),blob=new Blob([JSON.stringify(a,null,1)],{type:'application/json'}),u=URL.createObjectURL(blob),l=document.createElement('a');
  l.href=u;l.download='conhecidas.json';document.body.appendChild(l);l.click();l.remove();setTimeout(function(){URL.revokeObjectURL(u)},1000);
  setSt(a.length+' palavras exportadas (conhecidas.json)');
});
document.getElementById('imp').addEventListener('click',function(){document.getElementById('impf').click()});
document.getElementById('impf').addEventListener('change',function(){
  var f=this.files[0];if(!f)return;var r=new FileReader(),inp=this;
  r.onload=function(){try{var a=JSON.parse(r.result);if(!Array.isArray(a))throw 0;known=fromList(a);save();render();setSt(a.length+' palavras importadas')}catch(e){setSt('arquivo inválido')}inp.value=''};
  r.readAsText(f);
});
if(!hadLocal){fetch('conhecidas.json?t='+Date.now()).then(function(r){return r.ok?r.json():[]}).then(function(l){if(l.length){known=fromList(l);save();render();setSt(l.length+' palavras já sabidas carregadas')}}).catch(function(){})}
</script>
